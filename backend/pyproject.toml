[project]
name = "renti-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.30.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "neo4j>=5.20.0",
    "celery>=5.3.0",
    "tiktoken>=0.5.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    # LangChain 生态
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-deepseek>=1.0.1",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "deepagents>=0.1.0",
    # LLM Provider SDK（按需启用 - 当前 README 走 DeepSeek）
    "langchain-openai>=0.2.0",
    # "langchain-anthropic>=0.2.0",  # Claude：未启用，按需取消注释
    # "langchain-google-genai>=2.0.0",  # Gemini：未启用
    # "langchain-ollama>=0.2.0",  # Ollama：未启用（本地 TCM 模型时启用）
    # "langchain-qwq>=0.1.0",  # 通义 QwQ：未启用
    # "langchain-xai>=0.1.0",  # Grok：未启用
    # "langchain-xinference>=0.1.0",  # 与 deepagents 冲突
    "pymilvus>=2.6.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
renti-ai = { workspace = true }

[dependency-groups]
dev = [
    "renti-ai",
]

[tool.pytest.ini_options]
markers = [
    "integration: 集成测试，需要连接真实 Neo4j（db=neo4j）。无 Neo4j 时由 conftest.py 自动 skip",
    "unit: 单元测试，使用 mock，不依赖外部资源",
]
testpaths = ["tests"]
asyncio_mode = "auto"
