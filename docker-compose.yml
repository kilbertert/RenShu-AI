version: '3.8'

services:
  # ============================================
  # PostgreSQL - 患者、病例、账户等结构化数据
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tcm-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tcm_agent_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=tcm_pg_2026
    networks:
      - tcm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcm_agent_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis - 缓存（用户配置、模型信息、API Key）
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: tcm-redis
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - tcm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Qdrant 向量数据库 - 用于Mem0的语义检索
  # ============================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tcm-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE_HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=DEBUG
    networks:
      - tcm_network
    restart: unless-stopped

  # ============================================
  # Neo4j 图数据库 - 用于Mem0的关系检索
  # ============================================
  neo4j:
    image: neo4j:5.26.4
    container_name: tcm-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/tcm_graph_2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_heap_initial__size=512m
    networks:
      - tcm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  tcm_network:
    driver: bridge
